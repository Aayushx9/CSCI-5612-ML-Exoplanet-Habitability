<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transitTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="transitTitle">Diagram of a planet transiting its star, paired with the resulting dip in observed brightness</title>
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6b0"/>
      <stop offset="55%" stop-color="#e8a33d"/>
      <stop offset="100%" stop-color="#c1502e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="760" height="340" fill="#0b0f1a"/>

  <!-- orbit path -->
  <ellipse cx="180" cy="120" rx="150" ry="40" fill="none" stroke="#232d47" stroke-width="1.5"/>

  <!-- star -->
  <circle cx="180" cy="120" r="46" fill="url(#starGlow)"/>

  <!-- planet mid-transit -->
  <circle cx="140" cy="120" r="10" fill="#0b0f1a" stroke="#4a95a0" stroke-width="2"/>

  <!-- faint planet positions along orbit -->
  <circle cx="330" cy="120" r="6" fill="#4a95a0" opacity="0.5"/>
  <circle cx="180" cy="80" r="6" fill="#4a95a0" opacity="0.35"/>
  <circle cx="30" cy="120" r="6" fill="#4a95a0" opacity="0.5"/>

  <text x="180" y="205" text-anchor="middle" fill="#9aa3bd" font-family="IBM Plex Sans, sans-serif" font-size="13">
    Planet passes in front of its star
  </text>

  <!-- divider -->
  <line x1="380" y1="30" x2="380" y2="300" stroke="#232d47" stroke-width="1"/>

  <!-- light curve axes -->
  <line x1="420" y1="260" x2="730" y2="260" stroke="#232d47" stroke-width="1.5"/>
  <line x1="420" y1="70" x2="420" y2="260" stroke="#232d47" stroke-width="1.5"/>
  <text x="575" y="290" text-anchor="middle" fill="#9aa3bd" font-family="IBM Plex Sans, sans-serif" font-size="13">time</text>
  <text x="400" y="165" text-anchor="middle" fill="#9aa3bd" font-family="IBM Plex Sans, sans-serif" font-size="13" transform="rotate(-90 400 165)">brightness</text>

  <!-- light curve: flat, dip, flat -->
  <path d="M 430 100 L 500 100 L 525 160 L 560 160 L 585 100 L 720 100"
        fill="none" stroke="#e8a33d" stroke-width="2.5" stroke-linejoin="round"/>

  <text x="542" y="185" text-anchor="middle" fill="#c1502e" font-family="IBM Plex Sans, sans-serif" font-size="12">
    transit dip
  </text>
</svg>
